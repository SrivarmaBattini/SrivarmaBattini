<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Computer vision and robotics — visual tracking</title>
  <desc id="desc">A conceptual illustration of a vision tracking pipeline and pan-tilt servo mechanism.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF5F4"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#2CB7A8"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="420" rx="24" fill="url(#background)"/>
  <rect x="0" y="0" width="10" height="420" rx="5" fill="url(#teal)"/>
  <circle cx="670" cy="92" r="82" fill="#DDEFEA"/>
  <circle cx="740" cy="335" r="110" fill="#E2E8F0"/>
  <text x="48" y="55" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.5" fill="#0D9488">COMPUTER VISION · ROBOTICS</text>
  <text x="48" y="108" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#233030">Visual Tracking System</text>
  <text x="48" y="140" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#425252">Perception → target localization → servo control</text>

  <!-- Camera/vision frame -->
  <rect x="48" y="178" width="300" height="176" rx="14" fill="#233030"/>
  <rect x="66" y="196" width="264" height="140" rx="7" fill="#304545" stroke="#55706E" stroke-width="1.5"/>
  <path d="M82 210 H102 M82 210 V230 M314 210 H294 M314 210 V230 M82 322 H102 M82 322 V302 M314 322 H294 M314 322 V302" fill="none" stroke="#8DD4C8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="198" cy="265" r="33" fill="none" stroke="#8DD4C8" stroke-width="2.5" stroke-dasharray="5 5"/>
  <rect x="177" y="244" width="42" height="42" rx="4" fill="none" stroke="#2CB7A8" stroke-width="3"/>
  <path d="M198 233 V253 M198 277 V297 M166 265 H186 M210 265 H230" stroke="#2CB7A8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="198" cy="265" r="5" fill="#2CB7A8"/>
  <text x="68" y="375" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#647575">Illustrative tracking view</text>

  <!-- Process connector -->
  <path d="M366 263 H406" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round"/>
  <path d="M396 253 L408 263 L396 273" fill="none" stroke="#0D9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pan tilt mechanism -->
  <rect x="430" y="178" width="322" height="176" rx="14" fill="#FFFFFF" stroke="#D5E4E1" stroke-width="2"/>
  <text x="452" y="205" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#233030">Pan–tilt control</text>
  <path d="M590 318 V285" stroke="#233030" stroke-width="12" stroke-linecap="round"/>
  <rect x="551" y="315" width="78" height="15" rx="7" fill="#233030"/>
  <path d="M550 285 H630" stroke="#0D9488" stroke-width="10" stroke-linecap="round"/>
  <circle cx="590" cy="279" r="23" fill="#DDEFEA" stroke="#0D9488" stroke-width="4"/>
  <path d="M590 256 V235" stroke="#233030" stroke-width="9" stroke-linecap="round"/>
  <rect x="554" y="220" width="72" height="31" rx="8" fill="#233030"/>
  <circle cx="590" cy="235" r="10" fill="#8DD4C8"/>
  <path d="M520 267 A72 72 0 0 1 549 220" fill="none" stroke="#9FCFC5" stroke-width="3" stroke-dasharray="5 5"/>
  <path d="M648 220 A72 72 0 0 1 668 268" fill="none" stroke="#9FCFC5" stroke-width="3" stroke-dasharray="5 5"/>
  <text x="452" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#647575">Conceptual system illustration</text>
  <text x="48" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#647575">ROS 2 · OpenCV · Python · Servo control</text>

</svg>
